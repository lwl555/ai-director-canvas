# GitHub Pages 部署工作流
# 用途：把 AI 导演画布（纯静态前端）构建并发布到 GitHub Pages。
#
# 安全说明：
# - Agnes API key 绝不出现在本仓库 / 构建产物里，它只存在于 Supabase Edge Function 的 secret。
# - 本工作流只会把 SUPABASE 匿名 key（公开安全）和函数地址打进前端，用于调用代理函数。
#
# 使用前（仓库 Settings → Secrets and variables → Actions → Variables 里加）：
#   VITE_AGNES_BASE     = https://<你的项目ref>.functions.supabase.co/agnes-proxy
#   VITE_SUPABASE_URL   = https://<你的项目ref>.supabase.co
#   VITE_SUPABASE_ANON  = <你的 supabase anon key>   （anon key 本就公开，可用 Variable）
#
# 并在 Settings → Pages → Source 选择 "GitHub Actions"。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_AGNES_BASE: ${{ vars.VITE_AGNES_BASE }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON: ${{ vars.VITE_SUPABASE_ANON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Pages 项目站点资源根路径为 /<仓库名>/，用 --base 修正资源引用
      - name: Build
        run: npx vite build --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
