# 云端构建安卓 APK（无需本机 Android Studio）
# 触发：推送到 apk-build 分支（由平台后端 apk-build 函数写入 android/ 后自动触发）
# 产出：debug 签名 APK（手机「允许未知来源」可直接安装）
#   - 存在 android/app/src/main/assets/quickapp.html → 打包该快应用 → 资源名 quickapp-debug.apk
#   - 否则 → 打包平台壳（远程加载站点） → 资源名 app-debug.apk
# 发布到固定 Release（android-build），稳定下载地址：
#   https://github.com/lwl555/ai-director-canvas/releases/download/android-build/<app-debug.apk|quickapp-debug.apk>

name: Build Android APK

on:
  push:
    branches: [apk-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 显式安装 Gradle（仓库不含 gradle wrapper，避免依赖 wrapper 存在）
      - name: Install Gradle 8.5
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "GRADLE_BIN=/opt/gradle-8.5/bin/gradle" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: $GRADLE_BIN :app:assembleDebug --no-daemon

      - name: Decide asset name
        id: asset
        run: |
          if [ -f android/app/src/main/assets/quickapp.html ]; then
            echo "name=quickapp-debug.apk" >> "$GITHUB_OUTPUT"
          else
            echo "name=app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: android-build
          name: Android APK
          files: android/app/build/outputs/apk/debug/${{ steps.asset.outputs.name }}
          fail_on_unmatched_files: false
          body: 自动构建的安卓安装包（debug 签名，可直接安装）
