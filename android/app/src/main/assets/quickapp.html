<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄计时器 - 专注工作</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .timer-display {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .timer-svg {
            width: 100%;
            height: 100%;
        }

        .timer-circle {
            fill: none;
            stroke: white;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .progress-ring {
            transition: stroke-dashoffset 0.3s ease;
        }

        .timer-text {
            position: absolute;
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        @media (max-width: 480px) {
            .timer-display {
                width: 220px;
                height: 220px;
            }

            .timer-text {
                font-size: 44px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }

            .container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 番茄计时器</h1>
        <p class="subtitle">专注工作，提高效率</p>

        <div class="timer-display">
            <svg class="timer-svg">
                <circle class="timer-circle progress-ring" 
                        cx="140" cy="140" r="120" 
                        stroke-dasharray="753.98 753.98"/>
                <circle class="timer-circle" 
                        cx="140" cy="140" r="120" 
                        stroke="#f5f7fa"/>
            </svg>
            <div class="timer-text">25:00</div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">开始</button>
            <button id="stopBtn" class="btn btn-stop" disabled>停止</button>
            <button id="resetBtn" class="btn btn-reset">重置</button>
        </div>

        <div class="status" id="status">点击"开始"按钮启动计时器</div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">已完成</div>
                <div class="stat-value" id="completedCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">总时间</div>
                <div class="stat-value" id="totalTime">0m</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">剩余时间</div>
                <div class="stat-value" id="remainingTime">25m</div>
            </div>
        </div>
    </div>

    <script>
        class TomatoTimer {
            constructor() {
                this.defaultTime = 25 * 60; // 25分钟
                this.currentTime = this.defaultTime;
                this.isRunning = false;
                this.intervalId = null;
                this.completedCount = 0;
                this.totalMinutes = 0;
                
                this.initElements();
                this.initAudio();
                this.bindEvents();
                this.updateDisplay();
            }

            initElements() {
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.statusEl = document.getElementById('status');
                this.timerTextEl = document.querySelector('.timer-text');
                this.progressRingEl = document.querySelector('.progress-ring');
                this.completedCountEl = document.getElementById('completedCount');
                this.totalTimeEl = document.getElementById('totalTime');
                this.remainingTimeEl = document.getElementById('remainingTime');
                
                // 设置圆形进度条的最大周长
                const radius = 120;
                const circumference = 2 * Math.PI * radius;
                this.progressRingEl.style.strokeDasharray = `${circumference} ${circumference}`;
                this.progressRingEl.style.strokeDashoffset = circumference;
            }

            initAudio() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.playCompletionSound = () => {
                    const now = this.audioContext.currentTime;
                    
                    // 创建主音调（愉悦的完成音效）
                    const oscillator1 = this.audioContext.createOscillator();
                    const gainNode1 = this.audioContext.createGain();
                    
                    oscillator1.connect(gainNode1);
                    gainNode1.connect(this.audioContext.destination);
                    
                    // C大调和弦
                    oscillator1.frequency.setValueAtTime(523.25, now); // C5
                    oscillator1.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    oscillator1.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    
                    gainNode1.gain.setValueAtTime(0.3, now);
                    gainNode1.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    
                    oscillator1.start(now);
                    oscillator1.stop(now + 0.6);
                    
                    // 添加辅助音
                    setTimeout(() => {
                        const oscillator2 = this.audioContext.createOscillator();
                        const gainNode2 = this.audioContext.createGain();
                        
                        oscillator2.connect(gainNode2);
                        gainNode2.connect(this.audioContext.destination);
                        
                        oscillator2.frequency.value = 1046.50; // C6
                        gainNode2.gain.setValueAtTime(0.2, now + 0.3);
                        gainNode2.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
                        
                        oscillator2.start(now + 0.3);
                        oscillator2.stop(now + 0.9);
                    }, 300);
                };
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.start());
                this.stopBtn.addEventListener('click', () => this.stop());
                this.resetBtn.addEventListener('click', () => this.reset());
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            updateDisplay() {
                this.timerTextEl.textContent = this.formatTime(this.currentTime);
                this.remainingTimeEl.textContent = `${Math.floor(this.currentTime / 60)}m`;
                
                // 更新进度环
                const circumference = 2 * Math.PI * 120;
                const offset = circumference - (this.currentTime / this.defaultTime) * circumference;
                this.progressRingEl.style.strokeDashoffset = offset;
                
                // 根据剩余时间改变颜色
                if (this.currentTime <= 5) {
                    this.progressRingEl.style.stroke = '#ff6b6b'; // 最后5秒红色
                } else if (this.currentTime <= this.defaultTime * 0.2) {
                    this.progressRingEl.style.color = '#ffa502'; // 最后20%橙色
                } else {
                    this.progressRingEl.style.stroke = '#667eea';
                }
            }

            start() {
                if (this.isRunning) return;
                
                this.isRunning = true;
                this.startBtn.disabled = true;
                this.stopBtn.disabled = false;
                this.statusEl.textContent = '番茄计时中... 🎯';
                
                this.intervalId = setInterval(() => {
                    this.currentTime--;
                    this.updateDisplay();
                    
                    // 最后5秒发出提示音
                    if (this.currentTime === 5) {
                        this.playBeep();
                    }
                    
                    if (this.currentTime <= 0) {
                        this.completePomodoro();
                    }
                }, 1000);
            }

            stop() {
                if (!this.isRunning) return;
                
                clearInterval(this.intervalId);
                this.isRunning = false;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.statusEl.textContent = '已暂停 ⏸️';
            }

            reset() {
                this.stop();
                this.currentTime = this.defaultTime;
                this.updateDisplay();
                this.statusEl.textContent = '点击"开始"按钮启动计时器';
                this.progressRingEl.style.stroke = '#667eea';
            }

            completePomodoro() {
                this.stop();
                this.completedCount++;
                this.totalMinutes += 25;
                
                this.completedCountEl.textContent = this.completedCount;
                this.totalTimeEl.textContent = `${this.totalMinutes}m`;
                
                this.statusEl.textContent = '🎉 番茄钟完成！休息一下';
                this.playCompletionSound();
                
                // 播放完成音效后显示下一个选项
                setTimeout(() => {
                    this.startBtn.disabled = false;
                }, 1000);
            }

            playBeep() {
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                
                oscillator.start();
                oscillator.stop(this.audioContext.currentTime + 0.3);
            }
        }

        // 初始化计时器
        document.addEventListener('DOMContentLoaded', () => {
            new TomatoTimer();
        });
    </script>
</body>
</html>
