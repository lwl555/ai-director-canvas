<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>灵境小工具 · 计数器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, "PingFang SC", sans-serif;
    background: linear-gradient(160deg,#0f172a,#1e293b); color:#e2e8f0;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  h1 { font-size:20px; font-weight:600; margin:0 0 24px; }
  .num { font-size:72px; font-weight:700; color:#6366f1; margin:12px 0; }
  .row { display:flex; gap:14px; }
  button { width:72px; height:72px; border-radius:20px; border:none; font-size:28px;
    color:#fff; background:#334155; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  button:active { transform: translateY(2px); }
  .plus { background:#6366f1; } .minus { background:#e5484d; }
  .hint { margin-top:28px; font-size:12px; opacity:.55; }
</style>
</head>
<body>
  <h1>🔢 灵境计数器</h1>
  <div class="num" id="n">0</div>
  <div class="row">
    <button class="minus" onclick="dec()">−</button>
    <button class="plus" onclick="inc()">＋</button>
  </div>
  <div class="hint">由 AI 导演平台生成 · 已打包为独立安卓 APK</div>
<script>
  let n = 0;
  const el = document.getElementById('n');
  function inc(){ n++; el.textContent = n; if(window.AndroidApp) AndroidApp.notify('计数='+n); }
  function dec(){ n--; el.textContent = n; }
</script>
</body>
</html>
